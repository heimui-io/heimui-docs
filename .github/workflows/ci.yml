name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A syntax error takes the whole page blank rather than degrading. That has happened: an
      # unescaped `${` inside a Kotlin sample was read as a template expression and the site
      # rendered a header over nothing. `assets/docs-runtime.js` is included because it is shared,
      # so a mistake there blanks every section at once rather than one of them.
      - name: Every script parses
        run: |
          for f in $(find . -name '*.js' -not -path './.git/*'); do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "$f OK"
          done

      # A nav entry or cross-reference pointing at a section that does not exist is a dead link on
      # the published site, and nothing else would catch it.
      - name: No dead internal anchors
        run: |
          node - <<'JS'
          const fs = require('fs');
          let failed = false;
          for (const f of fs.readdirSync('.', { recursive: true }).filter(p => p.endsWith('docs.js'))) {
            const src = fs.readFileSync(f, 'utf8');
            const ids = new Set([...src.matchAll(/^\s*id:\s*'([\w-]+)'/gm)].map(m => m[1]));
            const dead = [...new Set([...src.matchAll(/href="#([\w-]+)"/g)].map(m => m[1]).filter(r => !ids.has(r)))];
            if (dead.length) { console.error(`${f}: dead anchors → ${dead.join(', ')}`); failed = true; }
            else console.log(`${f}: ${ids.size} sections, no dead anchors`);
          }
          if (failed) process.exit(1);
          JS

      # Sections now link to each other, and the check above only sees anchors within one file.
      # A cross-page link is the one that rots silently: renaming a section elsewhere leaves it
      # pointing at a page that loads and then sits at the top, which reads as a broken product
      # rather than a broken link.
      - name: No dead cross-page anchors
        run: |
          node - <<'JS'
          const fs = require('fs');
          const ids = f => new Set([...fs.readFileSync(f, 'utf8').matchAll(/^\s*id:\s*'([\w-]+)'/gm)].map(m => m[1]));
          const pages = Object.fromEntries(
            fs.readdirSync('.', { recursive: true })
              .filter(p => p.endsWith('docs.js'))
              .map(p => [`/${p.replace(/\/docs\.js$/, '')}/`, ids(p)])
          );
          const sources = fs.readdirSync('.', { recursive: true })
            .filter(p => (p.endsWith('.js') || p.endsWith('.html')) && !p.startsWith('.git'));
          let dead = 0;
          for (const f of sources) {
            for (const [, page, anchor] of fs.readFileSync(f, 'utf8').matchAll(/href="(\/[a-z-]+\/)#([\w-]+)"/g)) {
              if (!pages[page]) { console.error(`${f}: ${page} is not a documented section`); dead++; }
              else if (!pages[page].has(anchor)) { console.error(`${f}: ${page}#${anchor} does not exist`); dead++; }
            }
          }
          if (dead) process.exit(1);
          console.log(`${Object.keys(pages).length} sections, no dead cross-page anchors`);
          JS

      # The custom domain only works while this file says what it says.
      - name: CNAME intact
        run: |
          test "$(cat CNAME)" = "heimui.io" && echo "CNAME OK"

  corpus:
    name: Reference implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # The backend guide makes one specific promise -- these implementations agree with the corpus
      # -- and a promise nothing verifies is one that quietly stops being true. Each of these runs
      # the 22 published cases and fails on the first disagreement.
      #
      # Kotlin is absent on purpose: it is a JVM project rather than a script, and standing up
      # Gradle here costs more than it catches for a repository that is otherwise static files.
      - name: Python
        run: cd backend/examples/python && python3 run_corpus.py

      - name: Node
        run: cd backend/examples/node && node run-corpus.mjs

      - name: Go
        run: cd backend/examples/go && go run ./runcorpus
