<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <radialGradient id="bannerBg" cx="20%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="640" fill="url(#bannerBg)" />

  <!-- Subtle Tech Grid Lines -->
  <g stroke="#1F2937" stroke-width="1" opacity="0.4">
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
  </g>

  <!-- Mascot Symbol (Left) -->
  <g transform="translate(140, 90) scale(0.9)" filter="url(#bannerGlow)">
    <!-- Silhouette -->
    <path d="M 120 180 L 150 70 L 210 160 L 256 130 L 302 160 L 362 70 L 392 180 L 370 340 L 256 430 L 142 340 Z"
          fill="#0D1322" stroke="url(#neonGrad)" stroke-width="6" stroke-linejoin="round" />
    <polygon points="256,130 235,290 277,290" fill="#FFFFFF" opacity="0.95" />
    <ellipse cx="205" cy="225" rx="14" ry="9" fill="#D97706" />
    <ellipse cx="307" cy="225" rx="14" ry="9" fill="#D97706" />
    <circle cx="205" cy="255" r="8" fill="#00E5FF" />
    <circle cx="307" cy="255" r="8" fill="#00E5FF" />
    <circle cx="205" cy="255" r="3" fill="#FFFFFF" />
    <circle cx="307" cy="255" r="3" fill="#FFFFFF" />
    <path d="M 215 320 L 256 295 L 297 320 L 285 365 L 256 385 L 227 365 Z" fill="#111827" stroke="#00E5FF" stroke-width="4" />
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(620, 260)">
    <!-- Main Title -->
    <text x="0" y="50" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="url(#textGrad)" letter-spacing="-2px">
      HeimUI
    </text>

    <!-- Subtitle Badge -->
    <rect x="0" y="90" width="380" height="42" rx="21" fill="#161D2F" stroke="#374151" stroke-width="1.5" />
    <text x="24" y="118" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#00E5FF" letter-spacing="1px">
      SERVER-DRIVEN UI ENGINE
    </text>

    <!-- Description -->
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">
      High-performance SDUI for Kotlin Multiplatform &amp; Compose
    </text>
  </g>
</svg>
